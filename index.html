<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelia Loh</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #faf7f2;
    color: #2b2b2b;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 60px 20px 40px;
    background: linear-gradient(135deg, #d9c7a8, #eae0cc);
  }
  header h1 {
    font-size: 2.4em;
    color: #3d2b1f;
  }
  header p {
    margin-top: 8px;
    font-size: 1.1em;
    color: #5a4634;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    overflow: hidden;
    margin-bottom: 40px;
    transition: transform 0.2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
  }
  .card img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    display: block;
  }
  .card-content {
    padding: 24px;
  }
  .card-content h2 {
    font-size: 1.5em;
    margin-bottom: 10px;
    color: #3d2b1f;
  }
  .card-content p {
    color: #555;
    margin-bottom: 16px;
  }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    background: #b5651d;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    transition: background 0.2s ease;
  }
  .btn:hover {
    background: #8f4f16;
  }
  footer {
    text-align: center;
    padding: 30px;
    color: #999;
    font-size: 0.9em;
  }
</style>
</head>
<body>

<header>
  <h1>Adelia Loh</h1>
  <p>Welcome to my little corner of the internet 🐾🍹</p>
</header>

<div class="container">

  <div class="card">
    <img src="thehappybooch.jpeg" alt="The Happy Booch">
    <div class="card-content">
      <h2>🍹 The Happy Booch</h2>
      <p>My homemade kombucha journey — brewing something bubbly and good for the gut.</p>
      <a class="btn" href="https://www.instagram.com/thehappybooch" target="_blank">Follow on Instagram</a>
    </div>
  </div>

  <div class="card">
  <img src="kobenugget.jpg" alt="Kobe Nugget">
    <div class="card-content">
      <h2>🐶 Kobe Nugget</h2>
      <p>My puppy, chief mischief officer and full-time good boy.</p>
      <a class="btn" href="https://www.instagram.com/kobenuggetloh" target="_blank">Follow on Instagram</a>
    </div>
  </div>

</div>

<footer>
  Made with ❤️ by Adelia
</footer>

</body>
</html>
